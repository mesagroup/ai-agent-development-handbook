# Handbook traceability matrix (lidia-tech/lidia-agents#543) - hand-maintained source of truth.
#
# Maps every "##" section of docs/engineering/ onto the *-audit skill family.
# Render the committed Markdown view after every edit:
#     uv run python scripts/render_handbook_traceability.py
# Schema and classification rules:
#     docs/superpowers/specs/2026-07-29-handbook-traceability-matrix-design.md
#
# Classes: static (auditable from a repo snapshot) | artifact (auditable only
# via produced artifacts; absence is itself a finding) | process (not
# verifiable from the repo) | informative (non-normative).
#
# Severity: critical | important | minor - the risk a violation carries, not
# this repo's compliance with it. Required on static/artifact/process rows,
# absent on informative ones. Reuses audit-core's scale so a matrix row and an
# audit finding speak the same language. See the rendered legend for the tests.

# --- The README spine -------------------------------------------------------

- id: README/the-story-of-a-change
  section: "The story of a change"
  claim: Narrates the life of a single change through the nine parts and marks its human gates.
  class: informative
  note: Spine prose; every directive it alludes to is owned by the part it points at.

- id: README/starting-from-zero
  section: "Starting from zero"
  claim: Greenfield is the story of the first change, so the parts become a build order - thin end-to-end slice, tier skeleton, minimal harness, eval dataset and metric, rules file and gates from the first commit.
  class: process
  severity: important
  note: The section's own claim is the ordering, which no snapshot can date; the artifacts it lists are audited by the Part 3, 5, 7, 8 and 9 rows.

- id: README/the-four-throughlines
  section: "The four throughlines"
  claim: Four principles (evidence over intuition, capture the trail, reusable core vs. disposable task layer, executable standards) generate the directives and decide the cases they do not literally cover.
  class: process
  severity: important
  note: Each throughline's operational form belongs to its home part's rows; what this section adds is the disposition to apply them, which is culture rather than repo state.

- id: README/how-to-use-this-handbook
  section: "How to use this handbook"
  claim: Reading instructions - follow the imperatives, work from the checklists, treat the reasons as load-bearing, enter at any part.
  class: informative

- id: README/where-the-binding-rules-live
  section: "Where the binding rules live"
  claim: The binding project-specific rules live in the project's rules file, which both the team and the coding agents read as authoritative and which wins over the handbook; a mismatch between the two is a docs bug.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: docs-audit is the owner and has no check for an authoritative rules file or for doc-vs-doc contradiction; ci-audit's `ci/gate-enforcement` checks that mismatch only for what CI claims to enforce.

# --- Part 1: Development lifecycle ------------------------------------------

- id: lifecycle/front-load-the-judgment-a
  section: "Front-load the judgment"
  claim: Put the human weight on the expensive, irreversible moments (what is being built, and shipping it) and delegate the mechanical ones to the cheapest agent that can do them.
  class: process
  severity: important
  note: How human attention is allocated across a run is a judgment call no snapshot can date.

- id: lifecycle/front-load-the-judgment-b
  section: "Front-load the judgment"
  claim: Keep no scratch TODO list, and encode the whole run as a single reusable workflow that inlines brainstorming, plan-writing, subagent-driven implementation, review and merge.
  class: static
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: "no skill audits the development process itself. prompt-audit is not the owner despite a workflow being a prompt artifact: its subject is the product's own prompts and SOPs, the ones a shipped agent runs on, whereas this clause is about the harness the team drives to build that product. Auditing whether the lifecycle is encoded as one reusable workflow, and whether a scratch TODO file competes with the tracker, belongs with the delivery-trail domain, which is the same missing capability seen from the artifact side rather than the trail side."


- id: lifecycle/front-load-the-judgment-c
  section: "Front-load the judgment"
  claim: Run task management on an issue tracker, and trace every piece of work to an issue.
  class: artifact
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: no skill reads the issue tracker, so whether work traces to an issue sits outside the family's evidence base entirely; this is the delivery-trail domain the target issue creates.

- id: lifecycle/keep-batches-small-and-the-flow-fast
  section: "Keep batches small and the flow fast"
  claim: Scope each issue narrowly enough that its diff stays reviewable (a hard diff-size cap is a backstop, not the mechanism), and measure the whole idea-to-production distance with the four DORA measures rather than the convenient commit-to-deploy part.
  class: artifact
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: batch size and the DORA four measures are delivery-history evidence; ci-audit reads workflow definitions rather than delivery outcomes, and no skill reads pull-request or deployment history - the delivery-trail domain the target issue creates.

- id: lifecycle/decide-the-human-in-the-loop-gates-up-front
  section: "Decide the human-in-the-loop gates up front"
  claim: Choose once and explicitly which optional gates are active, keep spec review and the merge gate always on (prepare-for-merge is not approval, and never bump a major version without asking), and announce any decision taken on the human's behalf when an optional gate is off.
  class: process
  severity: critical
  note: Which gates were active for a run, and whether a human actually approved, is a decision the repo never records.

- id: lifecycle/scale-involvement-to-criticality
  section: "Scale involvement to criticality"
  claim: Match how present the human is (in-, on-, or out-of-the-loop) to how much the code matters (core differentiator, supporting, commodity), scaling oversight rather than who types, while the two bookend gates never scale off and criticality stays a separate axis from reuse.
  class: process
  severity: important
  note: Which criticality tier the team judged a change into, and how present a human actually was for it, are judgments the repo never records; the bookend gates the section refuses to scale off are owned by decide-the-human-in-the-loop-gates-up-front, and the reuse axis it separates criticality from is Part 3's.

- id: lifecycle/step-by-step-one-issue-end-to-end-a
  section: "Step-by-step: one issue, end to end"
  claim: Work the nine-station runbook - read the issue's comments before selecting it, brainstorm collaboratively and write no code in that phase, right-size each task to its own test cycle, dispatch a fresh implementer subagent per task, and loop a two-stage spec-plus-quality review until both verdicts pass.
  class: process
  severity: important
  note: The station order and the human moments along it are the section's own claim, and the order leaves no trace in the repo. The artifacts each station does leave are carried by the -b, -c, -d and -e rows.

- id: lifecycle/step-by-step-one-issue-end-to-end-b
  section: "Step-by-step: one issue, end to end"
  claim: Commit the spec and the plan as dated files in the docs tree, self-review each (the spec for placeholders, scope and ambiguity, the plan against every spec requirement), link the spec from the issue, and let no placeholder or TBD survive in a plan's code steps.
  class: artifact
  severity: important
  gap:
    recommendation: extend-skill
    note: docs-audit is the owner because specs and plans are docs-tree artifacts, but no check asks whether a change carries a committed spec and plan, nor scans a plan for placeholders; the per-change and linked-from-the-issue halves need the delivery-trail evidence base (#11).

- id: lifecycle/step-by-step-one-issue-end-to-end-c
  section: "Step-by-step: one issue, end to end"
  claim: Keep the branch mechanics honest - cut from up-to-date main and never implement on it, open a draft pull request whose body names the issue it closes and carries a test-plan checklist, then merge with a rebase and delete the branch locally and remotely.
  class: artifact
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: branch, pull-request and merge mechanics live in git and tracker history, which no skill in the family reads - the delivery-trail domain the target issue creates.

- id: lifecycle/step-by-step-one-issue-end-to-end-d
  section: "Step-by-step: one issue, end to end"
  claim: Select the model per role explicitly and frugally - the least powerful tier that fits, always named because an omitted model inherits the session's expensive one, with a mid-tier floor for reviewers and the most capable tier for the final whole-branch review.
  class: static
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: "a development-process claim, not a product-prompt one, so prompt-audit is not the owner even though a subagent definition is a prompt artifact it can read: what is being audited is how the team spends model capacity while building, not how the shipped agent is instructed. eval-audit's `eval/reproducibility` is the nearest existing check and refuses on the near-miss rule - it wants a pinned model version recorded for an eval run, which the omission the handbook forbids satisfies perfectly well."


- id: lifecycle/step-by-step-one-issue-end-to-end-e
  section: "Step-by-step: one issue, end to end"
  claim: Scope each subagent to its brief so it does not act on the whole plan, and carry any standing instruction of that kind in the dispatching prompt, since a subagent inherits none of the conventions the dispatcher works under.
  class: static
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: "a development-process claim like the two rows above: these are requirements on a dispatching prompt the team writes to build the product, not on a prompt the product ships, so prompt-audit's subject does not reach them. Its Tier A judges how well an existing prompt is written, never whether the project's standing operational instructions are carried into it at all."


- id: lifecycle/after-the-merge
  section: "After the merge"
  claim: Close the trail after merging - verify each acceptance criterion was actually implemented before ticking it, post a release-notes-style comment, and set the issue's final status.
  class: artifact
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: the post-merge trail is entirely tracker-side, so nothing in the family can see whether criteria were verified, ticked, or blind-checked - the delivery-trail domain the target issue creates.

- id: lifecycle/make-the-standard-executable-and-audit-periodically-a
  section: "Make the standard executable, and audit periodically"
  claim: Ask of every fix what stops the problem coming back, and take the highest-leverage answer - encode the standard as an executable check wired into CI (and pre-commit) rather than leaving it to memory and review diligence.
  class: static
  severity: important
  checks:
    - ci/gate-enforcement
    - eval/smoke-test-gate
  gap:
    recommendation: extend-skill
    note: ci-audit is the owner, and its `ci/gate-enforcement` check audits the gates that already exist; no check walks the project's binding rules to find the ones with no mechanical enforcer, and the local pre-commit half of the claim is unrepresented anywhere.

- id: lifecycle/make-the-standard-executable-and-audit-periodically-b
  section: "Make the standard executable, and audit periodically"
  claim: Run the periodic audit as the counterpart to standing gates - an evidence-based sweep that cites the artifact behind each finding, marks tooling that cannot run as no-evidence rather than pass, and produces a report-only diagnosis before fixes land one dimension at a time.
  class: artifact
  severity: important
  gap:
    recommendation: report-only
    note: this is audit-core's own charter, but audit-core declares no checks of its own so no row can cite one; audit cadence and past audit reports are outside every skill's evidence base.

- id: lifecycle/pre-merge-checklist
  section: "Pre-merge checklist"
  claim: Fourteen-item recap gating the merge - issue trace, approved spec, fresh branch, placeholder-free plan, per-task review verdicts, tests and coverage, green required gates, review dispositions, the agent quality gate, docs, prompt-change rationale, explicit approval, involvement depth matched to criticality with the bookend gates on regardless, and the post-merge trail.
  class: process
  severity: critical
  note: A recap, so what it adds is the act of working the list before merging. Every one of the fourteen items is owned by another Part 1 or Part 2 row - involvement depth by scale-involvement-to-criticality, the bookend gates by decide-the-human-in-the-loop-gates-up-front - which is why the row itself maps to nothing.

- id: lifecycle/see-also
  section: "See also"
  claim: Cross-links to the stance and Parts 2, 3, 6, 7, 8 and 9.
  class: informative

# --- Part 2: Implementation disciplines -------------------------------------

- id: implementation-disciplines/tdd-a
  section: "TDD"
  claim: Run the bite-sized loop for every feature and bugfix - failing test, see it fail, minimal code, see it pass, commit.
  class: process
  severity: important
  note: Test-first ordering is not datable from a snapshot, which sees only the finished commit. The residue it leaves - that the code arrived with tests, and that those tests bite - is carried by the -b row.

- id: implementation-disciplines/tdd-b
  section: "TDD"
  claim: Ship new code with unit tests covering its deterministic logic (analysis and tooling scripts included) without lowering coverage, defer only true I/O edges to integration tests, allow a throwaway battery pinning current behaviour as scaffolding for a pure refactor or port and delete it once the old and new paths agree, and judge the suite by whether it fails when the code breaks - real assertions rather than tautologies or over-mocking, branch and diff coverage, deterministic tests.
  class: static
  severity: important
  checks:
    - test/new-code-coverage
    - test/coverage-reach
    - test/assertion-strength
    - test/determinism
    - test/isolation
    - test/mutation

- id: implementation-disciplines/tdd-c
  section: "TDD"
  claim: Decide the unit-test coverage floor upfront rather than assuming a number - state a required floor and what it is measured over, record both somewhere executable (coverage config or CI gate) rather than aspirational, treat exclusions as part of the decision and never exclude load-bearing deterministic logic, justify a deliberately low floor, and pair the whole-project floor with a floor on changed lines.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: "test-audit is the owner and already carries the floor concept outside its checks - scope asks what floor the contributor guide or CI enforces, and the status scale reads meets-floor/below-floor - but no check asks whether a floor was stated, recorded executably, or justified. `test/coverage-reach` measures reach, so it would pass a project that never decided a floor, and pass one that omits its parsers from the denominator because excluded code is absent rather than uncovered. Mapping it would satisfy the claim with exactly what the clause forbids, so this row maps nothing. The declaration belongs to that skill's wave-1 sweep pass (#7 + #5 + #8)."

- id: implementation-disciplines/prompt-and-sop-engineering-a
  section: "Prompt and SOP engineering"
  claim: Give an agent's SOP a fixed shape in a .sop.md file (Overview, Parameters, ordered Steps carrying Constraints), write constraints with RFC 2119 keywords and give every negative one its reason inline, name the completion criterion and the early exits, and run a periodic cognitive-load analysis of constraint density and redundancy.
  class: static
  severity: important
  checks:
    - prompt/instruction-precision
    - prompt/positive-framing
    - prompt/role-objective
    - prompt/grounding
    - prompt/cognitive-load
    - prompt/sop-structure
    - prompt/sop-rfc2119
  gap:
    recommendation: extend-skill
    note: no prompt-audit check verifies whether an SOP names its completion criterion or its early exits - the observable state that ends the procedure and the conditions under which it should stop and say so instead of continuing. Tier A's role-objective check judges only the generic well-specified-prompt principle (a stated objective and scope), not this SOP-specific completion/stop-condition concept, so it does not reach the residue.

- id: implementation-disciplines/prompt-and-sop-engineering-b
  section: "Prompt and SOP engineering"
  claim: Explain in the commit message why a prompt changed, not just what, and keep prompt changes in their own commit separate from code.
  class: artifact
  severity: minor
  gap:
    recommendation: extend-skill
    note: co-owned - prompt-audit's remediation section already states this rule verbatim as a convention it follows, and eval-audit's `eval/prompt-quality` owns prompt-change hygiene through its missing-versioning-or-changelog clause, but neither actually reads commit messages to verify it, which is the evidence base the delivery-trail domain (#11) would supply.

- id: implementation-disciplines/prompt-and-sop-engineering-c
  section: "Prompt and SOP engineering"
  claim: Reserve the SOP for the judgment the model must exercise, and enforce any deterministically-checkable constraint in the harness instead - a schema on the output, a validator in the tool, a guard in the pipeline.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: prompt-audit is the owner but no check asks whether a constraint stated in the prompt could be enforced deterministically in code; its counterpart claim sits on ci-and-static-analysis-d.

- id: implementation-disciplines/ci-and-static-analysis-a
  section: "CI and static analysis"
  claim: Treat format, lint and type-check as distinct complementary gates run on every push and pull request and locally before committing, annotate enough that the checker can actually fail, and count a gate only where branch protection requires it and the contributor guide matches what the workflows enforce.
  class: static
  severity: important
  checks:
    - ci/gate-enforcement
  gap:
    recommendation: extend-skill
    note: ci-audit is the owner, and its `ci/gate-enforcement` check asks whether the type-check runs and is required, never whether it can fail - no check measures annotation coverage or checker strictness, the type-checking analogue of test-audit's `test/assertion-strength`.

- id: implementation-disciplines/ci-and-static-analysis-b
  section: "CI and static analysis"
  claim: Treat docstrings as a fourth checked surface - every public module and symbol carries one, audited for coverage and staleness.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: "docs-audit does audit docstrings, now as citable opt-in records (docs/docstring-coverage, docs/docstring-staleness), but each is a genuine near miss rather than full closure: docs/docstring-coverage only tests whether a docstring exists at all, so a one-word placeholder passes it while still failing the quality bar this claim wants, and docs/docstring-staleness only tests contradiction, so a docstring left incomplete after a change contradicts nothing and passes it while still failing the broader staleness this claim asks for; no check asks whether the docstring check itself is wired into the gate. One of three rows stating the docstring rule (with coding-hygiene-rules-that-surface-at-review-d and documentation/keep-the-living-docs-current-too-a), each carrying its own near-miss residue rather than one shared fix."

- id: implementation-disciplines/ci-and-static-analysis-c
  section: "CI and static analysis"
  claim: The gates are language-agnostic disciplines - only the toolchain changes, with a Python and a TypeScript equivalent given for each.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    target: "#5"
    note: ci-audit, prompt-audit and eval-audit are already language-neutral, so a TypeScript project still gets its pipeline, prompt and behavioural audits, and arch, deps, security and test now declare TypeScript tooling beside their Python tooling. What is left is two records that still declare `python:` alone - `arch/martin-metrics` (package stability metrics from a `grimp` graph) and `docs/docstring-coverage` (docstring presence from ruff's `D` rules, pydocstyle or interrogate) - and both set `optin` to true, so a default sweep of a TypeScript partition no longer meets a check with no lens. `tests/scripts/test_audit_checks.py::test_every_tooling_record_offers_a_typescript_lens` asserts that pair by equality, so this note goes stale loudly rather than quietly.

- id: implementation-disciplines/ci-and-static-analysis-d
  section: "CI and static analysis"
  claim: Never spend an agent on what a linter, formatter, or type-checker already enforces deterministically.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: no check flags a review or audit agent pointed at work a deterministic tool already does; prompt-audit is the nearest owner, as on prompt-and-sop-engineering-c.

- id: implementation-disciplines/the-code-review-protocol-a
  section: "The code-review protocol"
  claim: Treat review as the moment a human is forced to understand what ships and review what the change expresses - intent, design, whether it fits the system - leaving how the code is written to the CI gates; a review whose understanding one person silently absorbs has failed its primary purpose even when it catches a bug.
  class: process
  severity: important
  note: What review is for, and whether the understanding actually spread, is the one thing an approval never records. The mechanics that do leave a trail are carried by the -b row.

- id: implementation-disciplines/the-code-review-protocol-b
  section: "The code-review protocol"
  claim: Run the whole-branch review as a deliberately adversarial multi-perspective pass over the checklist's angles, score every finding against a fixed rubric and one agreed confidence threshold, post and fix at-or-above-threshold findings before merge, report all findings with their disposition, and hold scope discipline rather than dismissing a finding as pre-existing or forking new code away from its siblings.
  class: artifact
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: the review trail - inline pull-request comments and the findings table with its dispositions - is tracker-side evidence no skill reads, and no domain audits review discipline; this is the delivery-trail domain the target issue creates.

- id: implementation-disciplines/coding-hygiene-rules-that-surface-at-review-a
  section: "Coding-hygiene rules that surface at review"
  claim: Swallow no exceptions - report every one to the consumer with type and message, log it at the right level, or re-raise it, so the error message alone says what went wrong.
  class: static
  severity: important
  checks:
    - security/sensitive-data
  gap:
    recommendation: new-domain
    target: "#2"
    note: security-audit reaches only the security-relevant subset (broad handlers that hide security failures); the developer-facing half - an error collapsed into a generic internal error with no type or message - belongs to the observability domain the target issue creates, so the residue is a missing domain rather than a missing check in an existing skill.

- id: implementation-disciplines/coding-hygiene-rules-that-surface-at-review-b
  section: "Coding-hygiene rules that surface at review"
  claim: Leave no backward-compatibility wrappers in a pre-1.0 codebase - remove the old API and update every caller in the same pull request, with no re-export stubs.
  class: static
  severity: minor
  checks:
    - arch/over-abstraction

- id: implementation-disciplines/coding-hygiene-rules-that-surface-at-review-c
  section: "Coding-hygiene rules that surface at review"
  claim: Commit no environment-specific values - no personal absolute paths, account or profile names, or hostnames in code, docs, or scripts - use placeholders and say what they resolve to, and fix them retroactively when touching a file that has them.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: security-audit is the owner, since its `security/secrets-in-code` pass already walks every literal in the tree, but that check is scoped to credentials and a personal path or profile name is a portability leak rather than a secret, so nothing scans for one.

- id: implementation-disciplines/coding-hygiene-rules-that-surface-at-review-d
  section: "Coding-hygiene rules that surface at review"
  claim: Describe every settings field, keep module docstrings current with the module's purpose and interface, and prefer explicit enums or non-null defaults for agent tool parameters where the provider handles nullable arguments poorly.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: "docstring currency is exactly docs/docstring-staleness's own near miss: that check's detection is contradiction (a docstring actively wrong about parameters, return type, or behaviour), while this claim's 'current with purpose and interface' ask is broader - a docstring left incomplete after a change (a new parameter added but not yet mentioned) contradicts nothing and passes the check while still failing the ask. Not a duplicate of ci-and-static-analysis-b or documentation/keep-the-living-docs-current-too-a despite the shared clause: the two claims either side of it, self-documenting settings fields and provider-safe tool-argument types, have no check anywhere."

- id: implementation-disciplines/when-to-add-an-end-to-end-agent-quality-gate
  section: "When to add an end-to-end agent quality gate"
  claim: Give an agent a second gate above the unit tests - run it end to end on the branch against a frozen battery of representative queries in a cheap configuration, score against a checklist or judge rubric, and treat a drop below the pass bar as a blocking regression - for any change that can alter its behaviour, including the shared code on its import path.
  class: static
  severity: important
  checks:
    - eval/smoke-test-gate
    - eval/reproducibility
    - eval/regression-tracking
    - ci/gate-enforcement

- id: implementation-disciplines/see-also
  section: "See also"
  claim: Cross-links to Parts 1, 6 and 7 and the handbook index.
  class: informative

# --- Part 3: Codebase structure ---------------------------------------------

- id: codebase-structure/order-the-tiers-by-reuse
  section: "Order the tiers by reuse"
  claim: Sort the code by how much of it carries over to the next agent or task and let dependencies run only from the task-shaped code toward the reusable core, never the other way and never in a cycle; each project picks its own tier list, the ordering principle being what matters, and the handbook's typical layering runs shared schemas and types, core infrastructure, configuration, external integrations, capabilities, evaluation, then agents and applications.
  class: static
  severity: minor
  checks:
    - arch/layering
    - arch/cycles
  note: arch-audit's `arch/layering` check is explicitly at its strongest when the project documents its tiers, so it audits conformance to whichever tier list the project declares. What it does not second-guess is the ordering principle behind that list - sort by reuse - which is a design judgment rather than a graph property.

- id: codebase-structure/point-every-dependency-toward-the-core-and-never-cycle-a
  section: "Point every dependency toward the core, and never cycle"
  claim: Hold one invariant - an import may only point at a more-reusable tier than the one it lives in, and the graph has no cycles - so core infrastructure never imports an application's types, and cross-application reuse goes through composition (exposing one agent to another as a tool) rather than reaching into another application's internals.
  class: static
  severity: important
  checks:
    - arch/layering
    - arch/cycles

- id: codebase-structure/point-every-dependency-toward-the-core-and-never-cycle-b
  section: "Point every dependency toward the core, and never cycle"
  claim: Write the project's tier-import rule down explicitly, which tier may import which, so it is enforceable by an import-boundary linter in CI rather than by memory.
  class: static
  severity: minor
  checks:
    - ci/gate-enforcement
  gap:
    recommendation: extend-skill
    note: arch-audit is the owner, but its `arch/layering` check presupposes that the project has documented its tiers rather than asking whether it has, and no check looks for an import-boundary contract at all; ci-audit's `ci/gate-enforcement` reaches only the case where such a workflow already exists and asks whether it is required.

- id: codebase-structure/why-the-rule-matters-a
  section: "Why the rule matters"
  claim: Keep a convenience that a single application needs inside that application rather than migrating it down into the core, where it would bake one workflow's assumptions into shared code and couple every other consumer to them.
  class: static
  severity: important
  checks:
    - arch/over-abstraction
  gap:
    recommendation: extend-skill
    note: partial - arch-audit is the owner, and its `arch/over-abstraction` check reaches the migrated convenience only while it still has a single consumer, and what it measures there is the unused generality rather than the coupling. The case the handbook warns about hardest, a core convenience that has since acquired a second consumer and now binds both to one workflow's assumptions, reads as justified generality to that check and is invisible to every other one.
  note: Mapped through the check's one-consumer tell - a shared unit whose anticipated second caller never arrived - which is a real but partial reach; the residue is recorded as the gap above.

- id: codebase-structure/why-the-rule-matters-b
  section: "Why the rule matters"
  claim: Read an import that would violate the rule as a design smell rather than a lint nuisance - the concept is in the wrong tier, or it is two concepts that need splitting - which is how the shape pays off in independently testable tiers, local churn and an integration tax paid once.
  class: process
  severity: minor
  note: What a team does with a flagged import - relocate the concept, split it, or silence the rule - is a disposition the repo never records, and the three payoffs are explanatory prose.

- id: codebase-structure/watch-for-structural-decay-beyond-layering
  section: "Watch for structural decay beyond layering"
  claim: Periodically measure the declared architecture against the real import graph and watch five further decay signals - cycles (a warning within a package, a real break across one), coupling and cohesion (hub modules and grab-bag utils, split along cohesion seams), complexity, dead code (verified truly unreachable before deletion), and outsized files - as health signals rather than absolutes.
  class: static
  severity: important
  checks:
    - arch/layering
    - arch/cycles
    - arch/coupling
    - arch/complexity
    - arch/dead-code
    - arch/size
  note: The closest section-to-skill fit anywhere in the handbook - arch declares a check for every signal named here, and adds `arch/hidden-coupling` for the edges an import graph misses and `arch/over-decomposition` for the opposite fault, neither of which this section names. The cadence ("periodically") is process, and the closing pointer to an import-linter contract in CI is carried by point-every-dependency-toward-the-core-and-never-cycle-b.

- id: codebase-structure/compose-agents-with-typed-hooks-over-a-generic-runner-a
  section: "Compose agents with typed hooks over a generic runner"
  claim: Don't fork a base agent - give the core tier a generic runner that owns the run lifecycle and exposes a small set of hook methods (create the agent, build the collector, format the query, post-process the result), customize each application by overriding those hooks, and narrow the runner's loose metadata into typed sub-models so run records are self-describing.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: arch-audit is the nearest owner, but no check detects plumbing duplicated once per application - the tell is repetition across agents, not a bad import - and its axes point the other way, since a generic runner with one implementer reads as `arch/over-abstraction`, so composition-over-forking stays invisible until the fork produces a cycle or a layering break.

- id: codebase-structure/compose-agents-with-typed-hooks-over-a-generic-runner-b
  section: "Compose agents with typed hooks over a generic runner"
  claim: Build multi-agent systems by exposing one agent to another as a tool, the only sanctioned cross-application dependency, and design the split so it reflects a genuine data dependency between sub-agents rather than an arbitrary partition.
  class: static
  severity: important
  checks:
    - arch/layering
  gap:
    recommendation: extend-skill
    note: "arch-audit is the owner - the as_tool rule is a dependency-rule question it can already see, and a spurious sub-agent boundary is a decomposition defect `arch/over-decomposition` is the right lens for. What that check reads today is the module import graph, not the agent-composition graph, so whether a split corresponds to a real hand-off is invisible; the fix is to extend that check to the second graph."

- id: codebase-structure/dispatch-on-a-discriminator-not-a-type
  section: "Dispatch on a discriminator, not a type"
  claim: Select interchangeable backends through a polymorphic configuration - a base config carrying a mode discriminator, each concrete variant in its own module, dispatch by match or switch on the discriminator literal and never by a runtime type test - with a settings library resolving environment variables per variant and one provider-agnostic entry point returning a uniform result type.
  class: static
  severity: minor
  checks:
    - arch/layering
  gap:
    recommendation: extend-skill
    note: "arch-audit is the owner, and the row maps only on the consequence the handbook names, a type-test chain that couples the dispatcher to every concrete class and so breaks a tier boundary; no check flags isinstance/instanceof dispatch as such, nor asks for a single provider-agnostic entry point or declarative per-variant settings resolution. The section is written from a Python vantage (Pydantic discriminated unions, match on a Literal, pydantic-settings per variant); the equivalent TypeScript shape - a discriminated union on a literal tag, switch with exhaustiveness checking, and a schema library resolving env per variant - needs confirming before this row is audited on a TS codebase (#5)."

- id: codebase-structure/name-every-configuration-worth-reusing
  section: "Name every configuration worth reusing"
  claim: Treat a configuration as the full bundle that pins a run - model, its parameters, tool and feature toggles, budgets and limits - and give any combination worth reusing a name as a machine-readable profile, selectable by name and discoverable by listing, so scripts, eval harnesses and agents reference it by name instead of reconstructing a pile of flags per call site.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: eval-audit is the owner, and its `eval/reproducibility` check is the nearest existing one but asks only that a run's config be recorded, which a reconstructed flag pile satisfies; nothing asks whether reusable configurations are named, listable and referenced by name. Part 5's bundle-configuration-into-named-profiles carries the same claim from the harness side.

- id: codebase-structure/checklist-placing-new-code--reviewing-an-import
  section: "Checklist: placing new code / reviewing an import"
  claim: Seven-item recap for placing code or reviewing an import - most reusable tier that fully contains the concerns, every import pointing at a more-reusable tier, no new cycle, single-application conveniences left in place, cross-application reuse by composition, discriminator dispatch, and the layering rule enforced by an import-linter contract in CI.
  class: process
  severity: important
  note: A recap, so what it adds is the act of working the list at review time. Each of the seven items is owned by a Part 3 row above.

- id: codebase-structure/see-also
  section: "See also"
  claim: Cross-links to Parts 4 and 5 and the handbook index.
  class: informative

# --- Part 4: The three-layer document model ---------------------------------

- id: three-layer-model/a-document-has-no-privileged-decomposition
  section: "A document has no privileged decomposition"
  claim: Resist modelling a document type once and reusing that schema forever - importance is relative to the question, so no view-from-nowhere schema exists - while conceding that the reusable core is real, since intrinsic structure fully generalizes and a thin vocabulary of domain entities partially does, leaving only the task decomposition use-relative.
  class: process
  severity: minor
  note: The premise of the part - a modelling stance about where generality is real - which no snapshot can date. Its operational form, three explicit layers with different reuse profiles, is carried by the rows below.

- id: three-layer-model/know-the-three-layers
  section: "Know the three layers"
  claim: Split document knowledge into three layers with distinct reuse profiles and epistemic status - Layer 1 intrinsic structure (fully reusable, perception), Layer 2 domain entities (partially reusable, grounding), Layer 3 workflow knowledge (not reusable, inference) - a decomposition that is domain-general rather than domain-specific.
  class: static
  severity: important
  gap:
    recommendation: report-only
    note: whether a document system's data model separates the three layers is visible in a snapshot, but no check owns it - arch-audit's `arch/layering` check reads module tiers, not data layers, and mapping this to it would audit the wrong graph. An auditor diagnoses it in report prose against Part 4's checklist.

- id: three-layer-model/never-skip-a-layer
  section: "Never skip a layer"
  claim: Never put the raw document into the prompt and ask the final Layer-3 question directly - the shortcut collapses three distinct error sites into one opaque call, so a failure stops being localizable to a layer - noting that re-reading a span the lower layers point at is navigation rather than skipping, and re-explaining the rule at the code review of every new agent.
  class: static
  severity: important
  gap:
    recommendation: report-only
    note: a pipeline that dumps a raw document into the final prompt is visible in a snapshot, yet no check audits it; prompt-audit's `prompt/grounding` is the nearest and asks whether the prompt supplies the context the task needs, never whether that context arrived through the lower layers. The review-ritual clause is process.

- id: three-layer-model/hold-the-contracts-that-make-layering-pay-off-a
  section: "Hold the contracts that make layering pay off"
  claim: Make Layer 1 a single engine-agnostic representation - typed blocks, a containment hierarchy, provenance on every block, engine identity in the metadata rather than in the block shape - populated by a thin per-engine builder, with everything downstream reading the representation and never a raw engine output.
  class: static
  severity: minor
  checks:
    - arch/layering
  gap:
    recommendation: extend-skill
    note: arch-audit is the owner of the anti-corruption boundary, a dependency rule (only the builder may import an engine's schema) it enforces once the project declares it among its layering rules. The representation's own requirements - typed blocks, containment, per-block provenance, engine identity kept out of the block shape - are schema properties no check inspects and no skill is a natural owner of, exactly as on hold-the-contracts-that-make-layering-pay-off-b; that residue is report prose against Part 4's checklist.

- id: three-layer-model/hold-the-contracts-that-make-layering-pay-off-b
  section: "Hold the contracts that make layering pay off"
  claim: Hold the three remaining contracts - derive every block id from content rather than position, canonicalizing before hashing and treating cross-engine stability as an alignment problem rather than a property of the hash; run refinements as versioned, additive passes over an immutable base, keyed by those ids and stamped with implementation and version; and keep Layer 2 to task-independent domain facts while task-shaped judgments stay in each workflow's Layer 3.
  class: static
  severity: important
  gap:
    recommendation: report-only
    note: identity stability, additive enrichment over an immutable base, and the Layer-2/Layer-3 boundary are document-model design contracts with no check anywhere; the closest analogue is arch-audit's `arch/over-abstraction` check reading the same keep-the-core-sparse rule in the module graph (Part 3's why-the-rule-matters-a), which cannot see it in data. An auditor diagnoses these against Part 4's checklist in report prose.

- id: three-layer-model/compose-typed-tools-over-one-fuzzy-lookup
  section: "Compose typed tools over one fuzzy lookup"
  claim: Give an agent precise, typed operations over a layered document - structural navigation, clause search, entity-in-context, and semantic search over clean anchored units, each optionally following resolved references - instead of one similarity search, make choosing and composing the right tool the agent's job, and rest every tool on identifiers that survive re-extraction.
  class: static
  severity: important
  gap:
    recommendation: report-only
    note: no skill audits the shape of an agent's tool surface; eval-audit's `eval/prompt-quality` reaches tools only as drift between a prompt and the tools that exist, and prompt-audit judges the text of a prompt rather than what it is given to call. An auditor diagnoses the tool surface in report prose against Part 4's checklist, as on the other Part 4 rows.

- id: three-layer-model/why-this-is-the-organizing-principle-not-just-a-document-feature
  section: "Why this is the organizing principle, not just a document feature"
  claim: Keep the reusable core sparse and stable and the task layer rich and disposable is the document-model rule and the module-dependency rule at once, and because the layers are separable they are separately evaluable - a golden dataset per layer instead of one ill-defined end-to-end number.
  class: static
  severity: important
  checks:
    - eval/coverage
  note: Mapped on the per-layer dataset claim, the document-side twin of Part 7's unit-by-unit rule - a layer visible only inside an end-to-end score is an uncovered capability. The code-shape half is Part 3's rows.

- id: three-layer-model/checklist-reviewing-a-document-capability
  section: "Checklist: reviewing a document capability"
  claim: Six-item recap for reviewing a document capability - the Layer-3 answer reached through Layers 1 and 2, downstream code reading the engine-agnostic representation, content-derived ids with alignment across engines, versioned additive passes over an immutable base, Layer 2 holding only task-independent facts, and a failure localizable to one separately evaluable layer.
  class: process
  severity: important
  note: A recap, so what it adds is the act of working the list at the review of a document capability. Each of the six items is owned by a Part 4 row above.

- id: three-layer-model/see-also
  section: "See also"
  claim: Cross-links to Parts 3 and 7 and the handbook index.
  class: informative

# --- Part 5: The extended agent harness -------------------------------------

- id: agent-harness/build-the-harness-dont-inline-the-plumbing
  section: "Build the harness, don't inline the plumbing"
  claim: Solve model access, configuration, headless execution and reliability once in the shared core and configuration tiers instead of wiring them into each agent module, so the marginal agent is mostly its prompt and its tools, and put the production-reliability decisions in the harness so bounding is the default rather than an afterthought each author reinvents.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: arch-audit is the nearest owner but has no check for plumbing duplicated once per agent - the tell is repetition across applications, not a bad import - and nothing audits which tier the reliability defaults live in; the bounding half of the claim is carried by make-bounding-the-default.

- id: agent-harness/resolve-models-through-aliases-never-hard-coded-ids
  section: "Resolve models through aliases, never hard-coded IDs"
  claim: Never name a concrete provider model inline - take a short alias whose prefix encodes the provider and resolve it through a central catalog that stays the single place knowing real model IDs, regions and credentials - so switching the model a run uses is a one-token change and screening a dozen candidates never touches the agent.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: eval-audit is the owner, since model identity is its surface, but no check scans call sites for inline provider model IDs; its `eval/reproducibility` check is the nearest and wants a run's model version pinned and recorded, which an inline ID satisfies perfectly well - the worked example of the near-miss rule, mapping it would pass exactly what the handbook forbids - and security-audit's `security/secrets-in-code` sees only the credentials half of what the catalog centralizes.

- id: agent-harness/expose-model-parameters-as-optional-defaulted-flags
  section: "Expose model parameters as optional, defaulted flags"
  claim: Make generation parameters (temperature, top-p, penalties) optional flags that fall back to provider defaults, expose reasoning or extended thinking as a budget flag where the model supports it, and settle whether any such change is an improvement as a hypothesis measured against a frozen benchmark, one variable at a time.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: eval-audit is the owner, since the generation-parameter surface is exactly what a like-for-like comparison varies one variable at a time, but the section's own claim is wholly unmapped - no check asks whether generation parameters are exposed as optional flags falling back to provider defaults, nor whether a reasoning budget flag exists where the model supports one.
  note: The closing clause - treat a parameter change as a hypothesis measured against a frozen benchmark, one variable at a time - is a cross-reference to Part 7 and is already owned there, split across two rows - the one-variable-at-a-time half by evaluation/measure-honestly-c, which classes it artifact and carries eval-audit's `eval/methodology` and `eval/reproducibility`, and the frozen-benchmark half by evaluation/build-a-dataset-you-can-trust. This row keeps only the harness-side claim, the same division offer-cheap-and-mock-backends uses for its Part 7 clauses.

- id: agent-harness/bundle-configuration-into-named-profiles
  section: "Bundle configuration into named profiles"
  claim: Have the configuration tier bundle a model, its parameters and feature toggles into a named profile that is selectable by name, discoverable by listing and machine-readable, so scripts and eval harnesses reference a configuration by name and "run the cheap profile" becomes an unambiguous shared instruction.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: the same unmapped claim and the same owner as Part 3's name-every-configuration-worth-reusing, stated from the harness side - eval-audit's `eval/reproducibility` is the nearest existing check and is satisfied by a recorded flag pile, and no check asks for named, listable, machine-readable profiles.

- id: agent-harness/ship-every-agent-with-a-headless-cli
  section: "Ship every agent with a headless CLI"
  claim: Give every agent a headless command-line entry point that takes a query and writes its artifacts to an output directory, make it the same path an eval harness drives as a subprocess so no separate eval mode can diverge from production, land artifacts in a dated subfolder that names what produced the run, and build any interactive UI as that CLI's peer rather than a second implementation.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: eval-audit is the owner, because this is the precondition for its entire evidence base and an eval driving a code path production never takes is a validity threat next door to `eval/contamination`; still, no check asks whether a headless artifact-producing entry point exists, whether the eval path is the production path, or whether run artifacts are named and kept so a result stays findable months later.

- id: agent-harness/offer-cheap-and-mock-backends-a-fast-inner-loop-is-a-discipline
  section: "Offer cheap and mock backends: a fast inner loop is a discipline"
  claim: Offer cheaper flag-selected backends - a mock backend such as a small model over a fixed knowledge base, or a lighter real one for the same capability - that keep the loop fast without changing the agent, treat the cheap inner loop as a first-class capability because it is what buys a variance band instead of an anecdote, and compare backends on full cost including the downstream context a stand-in inflates.
  class: static
  severity: important
  checks:
    - eval/regression-tracking
  note: "`eval/regression-tracking` names a cheap/mock eval mode outright, so this is the most direct mapping in Part 5. The two clauses it does not reach inherit gaps already recorded in Part 7 - the variance band on evaluation/measure-honestly-a (#3) and full-cost accounting on evaluation/measure-honestly-b (#2)."

- id: agent-harness/make-bounding-the-default
  section: "Make bounding the default"
  claim: Bake six reliability defaults into the harness rather than into each agent - wall-clock and idle timeouts on turns and streaming loops, a hardened outbound HTTP client (explicit connect and read timeouts, bounded retries, keep-alive) whose retries wrap only operations safe to repeat, a circuit breaker on a dependency that keeps failing, a cycle and token budget cap on the agent loop, a size strategy for oversized tool results, and time-bounded teardown of external resources - because an unbounded call, cycle or payload each exhaust a resource.
  class: static
  severity: critical
  gap:
    recommendation: new-domain
    target: "#2"
    note: "production-reliability bounding has no owner anywhere in the family - not one of the eight skills declares a check for timeouts, retry safety, circuit breakers, loop or payload caps. The planned performance/cost and observability lenses in #2 are the nearest: they would see the symptoms (a hung run, an unattributed spend, an undiagnosable failure) but their stated scope is measurement and diagnosability, not the harness-level bounds that prevent them. Folded into #2 by decision on 2026-07-29, widening that issue from measuring the symptom to auditing the bound - the alternative, a ninth reliability domain, would split one dependency call between two lenses."

- id: agent-harness/checklist-standing-up-a-new-agent
  section: "Checklist: standing up a new agent"
  claim: Eight-item recap for standing up an agent - model alias through the catalog, optional defaulted parameter flags, a named profile, a headless CLI that is the eval path, dated self-describing artifact folders, a flag-selectable cheap or mock backend, time-bounded external calls with retries only on repeatable operations, and bounded loop, payload and failing dependencies.
  class: process
  severity: critical
  note: A recap, so what it adds is the act of working the list when a new agent is stood up. Each of the eight items is owned by a Part 5 row above.

- id: agent-harness/see-also
  section: "See also"
  claim: Cross-links to Parts 3, 6 and 7 and the handbook index.
  class: informative

# --- Part 6: Observability --------------------------------------------------

- id: observability/instrument-before-you-tune
  section: "Instrument before you tune"
  claim: Make the first move on any performance question adding the per-item metadata that measures what happens rather than running a parameter sweep, look upstream of the part you were about to optimize because the highest-leverage intervention frequently sits there, and distrust averages, since a healthy-looking overall number can mask a bimodal split whose real win is eliminating the low mode at its source.
  class: process
  severity: important
  note: The section's own claim is the order of moves in an investigation - instrument, then tune - which no snapshot can date. The instrumentation it demands is carried by capture-per-subagent-per-tool-usage.

- id: observability/keep-observability-out-of-the-models-context
  section: "Keep observability out of the model's context"
  claim: Send analysis metadata through a side channel the model never sees - persist per-item timing, sizes, utilization and cost alongside the run in its artifacts rather than inside the prompt, and attach any bookkeeping a tool must carry to a metadata envelope the downstream code consumes rather than to the tool output the model reads.
  class: static
  severity: important
  checks:
    - prompt/grounding
  gap:
    recommendation: new-domain
    target: "#2"
    note: mapped only where the metadata is visible in the prompt text, which `prompt/grounding` flags as a pile of context the task does not need; the side channel itself - a metadata envelope consumed by downstream code and persisted into the run artifacts - is a runtime data path no check inspects.

- id: observability/capture-per-subagent-per-tool-usage
  section: "Capture per-(sub)agent, per-tool usage"
  claim: Have the run harness produce a typed per-(sub)agent and per-tool usage record - tokens including cache read and write, wall-clock timing, agent-loop cycles, and per-tool total time and cost - so that utilization (how much of everything fetched actually informed the answer) and the stage a multi-agent run spends its time in both become visible.
  class: static
  severity: important
  gap:
    recommendation: new-domain
    target: "#2"
    note: not one of the eight skills declares a check for run instrumentation; eval-audit's `eval/regression-tracking` is the nearest and asks whether eval results are tracked over time and cheap to produce, never whether a run emits a per-agent, per-tool usage record at all.

- id: observability/account-for-the-full-cost-not-the-convenient-part
  section: "Account for the full cost, not the convenient part"
  claim: Take cost from actual billing rather than estimating it from token counts, count cache read and write tokens, sub-agent calls, latency and retries, price a component by its effect on the whole pipeline rather than by its local price, pair every efficiency number with an independent quality evaluation, and lead with absolute figures over percentages.
  class: artifact
  severity: important
  checks:
    - eval/methodology
  gap:
    recommendation: extend-skill
    target: "#2"
    note: the pairing clause is mapped because an efficiency number reported on its own is exactly the gameable proxy `eval/methodology` exists to catch; full-cost accounting is the same unmapped claim recorded on evaluation/measure-honestly-b, stated here from the observability side, and the target issue is the cost domain whose accounting rules the new eval-audit check should reuse.

- id: observability/make-errors-diagnosable
  section: "Make errors diagnosable"
  claim: Swallow no exception - report each to the downstream consumer with its type and message at minimum, log it at the right level where it is actually visible during debugging, or re-raise it for a better-positioned caller - so the error message alone says what went wrong without reproducing the issue, a generic internal-error string being the opposite of observability.
  class: static
  severity: important
  checks:
    - security/sensitive-data
  gap:
    recommendation: new-domain
    target: "#2"
    note: the same division and the same recommendation as Part 2's coding-hygiene row, which states this rule as a review rule - security-audit reaches only the broad handlers that hide a security failure, and the developer-facing half, an exception collapsed into a generic string carrying neither type nor message, belongs to the observability domain the target issue creates.

- id: observability/close-the-loop-production--development
  section: "Close the loop: production → development"
  claim: Persist the same per-(sub)agent usage record with each production interaction so a real-world session can be triaged after the fact - where a turn spent its time, whether it hung or merely ran long, which tool errored - because instrumentation that persists into production artifacts is what lets you debug the run you were not watching.
  class: static
  severity: important
  gap:
    recommendation: new-domain
    target: "#2"
    note: no check asks whether instrumentation reaches the production path; every skill's evidence base stops at the repo and at eval runs, so a project whose dev runs are fully instrumented and whose production interactions record nothing passes each existing check.

- id: observability/checklist-instrumenting-a-run
  section: "Checklist: instrumenting a run"
  claim: Eight-item recap for instrumenting a run - per-(sub)agent and per-tool usage recorded with cache read/write tokens, timing, loop cycles and per-tool cost, a typed record rather than a loose dict, analysis metadata on a side channel, utilization captured, cost from actual billing with the whole-pipeline effect included, every efficiency number paired with a quality number, no swallowed exceptions, and the same record persisted into production artifacts.
  class: process
  severity: important
  note: A recap, so what it adds is the act of working the list when a run is instrumented. Each of the eight items is owned by a Part 6 row above.

- id: observability/see-also
  section: "See also"
  claim: Cross-links to Parts 2, 5 and 7 and the handbook index.
  class: informative

# --- Part 7: Evaluation -----------------------------------------------------

- id: evaluation/the-enemy-is-false-confidence
  section: "The enemy is false confidence"
  claim: Treat every non-trivial change as a hypothesis and keep the decision falsifiable - the dataset and the metric must exist before the decision they settle.
  class: process
  severity: important
  note: The ordering (yardstick before decision) is not datable from a snapshot; its auditable residue - gold independence and a frozen dataset - is carried by the build-a-dataset-you-can-trust row.

- id: evaluation/run-the-loop-a
  section: "Run the loop"
  claim: Run the loop and do not stop at shipping - re-measure afterwards, because the change surfaces new failure forms that become the next dataset extension.
  class: process
  severity: important
  note: Whether anyone re-measured after shipping is an act, not a repo state - a dataset that grew could equally be routine curation. The residue it leaves, the decision and its evidence written where the next person finds them, is carried by the -b row.

- id: evaluation/run-the-loop-b
  section: "Run the loop"
  claim: Record each decision and its evidence where the next person can find it.
  class: artifact
  severity: important
  checks:
    - eval/regression-tracking

- id: evaluation/measure-the-behaviors-that-matter-a
  section: "Measure the behaviors that matter"
  claim: Enumerate the behaviors the product depends on - accuracy, grounding, format, refusals, latency and cost, the specific failure modes, and adversarial injection-resistance - and map each to an eval, because an unevaluated capability is an unmonitored one.
  class: static
  severity: important
  checks:
    - eval/coverage
    - eval/prompt-quality

- id: evaluation/measure-the-behaviors-that-matter-b
  section: "Measure the behaviors that matter"
  claim: Match the grader to the behavior - code-graded assertions, judge-graded rubrics, and trajectory graders that assert on the path the run took rather than only on its answer.
  class: static
  severity: important
  checks:
    - eval/methodology
  gap:
    recommendation: extend-skill
    note: eval-audit is the owner, and its `eval/methodology` check reaches the wrong-grader case as "a metric that is a gameable proxy", but it never asks which grader *type* the behavior needs, and trajectory grading - asserting on the path a run took rather than on its answer - is unrepresented anywhere in the family.

- id: evaluation/build-a-dataset-you-can-trust
  section: "Build a dataset you can trust"
  claim: Draw candidates from a source independent of the system under test, choose the dataset shape that supplies that independence, measure prevalence before planning the harvest, and freeze the set for the duration of a comparison.
  class: static
  severity: important
  checks:
    - eval/contamination
    - eval/methodology
    - eval/reproducibility

- id: evaluation/measure-honestly-a
  section: "Measure honestly"
  claim: A single run of a stochastic system is an anecdote - run each candidate several times and report the spread, per-case k-of-N reliability bands and the strict pass^N aggregate.
  class: artifact
  severity: important
  gap:
    recommendation: extend-skill
    target: "#3"
    note: no eval-audit check requires repeated runs or a reported variance band; the target issue exists to add exactly this one.

- id: evaluation/measure-honestly-b
  section: "Measure honestly"
  claim: Settle quality/cost trade-offs on full cost taken from actual billing - cache read/write tokens, sub-agent calls, latency and retries included - and lead with absolute figures.
  class: artifact
  severity: important
  gap:
    recommendation: extend-skill
    target: "#2"
    note: extend eval-audit - its `eval/regression-tracking` check is about the cost of running evals, not about pricing a candidate comparison honestly; the target issue is the cost domain whose accounting rules the new eval-audit check should reuse, not itself the thing being extended.

- id: evaluation/measure-honestly-c
  section: "Measure honestly"
  claim: Keep comparisons like-for-like by changing one variable at a time, bucket refusals and API errors apart from quality failures, and make every reported number regenerable from a pinned model, a recorded config and kept artifacts.
  class: artifact
  severity: important
  checks:
    - eval/methodology
    - eval/reproducibility

- id: evaluation/pick-the-approach-that-fits-the-decision
  section: "Pick the approach that fits the decision"
  claim: Match the approach to the decision's shape - screening funnel, blind paired A/B, ground-truth evaluation, anchor-based recall probe, golden-set benchmark - and reach for the cheapest that actually answers your question.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: eval-audit is the owner, and none of its checks asks whether the eval approach fits the decision it settles, nor whether expensive semantic scoring is staged behind cheap deterministic gates.

- id: evaluation/grow-the-eval-into-a-gate
  section: "Grow the eval into a gate"
  claim: An eval earns merge-blocking authority in rungs - offline, then shadow mode on production traffic, then a required CI gate - and a miss it lets through becomes a new case in the dataset.
  class: static
  severity: important
  checks:
    - eval/smoke-test-gate
    - ci/gate-enforcement
  gap:
    recommendation: extend-skill
    note: the middle rung - "run it in shadow mode on production traffic, blocking nothing, before it can block a merge" - has no check anywhere; eval-audit is the owner, and its `eval/smoke-test-gate` covers only the promoted, merge-blocking end of the ladder.

- id: evaluation/use-the-llm-judge-only-where-it-agrees-with-the-human
  section: "Use the LLM judge only where it agrees with the human"
  claim: Trust an LLM judge only on the dimensions where measured human correlation shows it tracks the expert, pair efficiency metrics with an independent quality measure, and treat a gold label as a revisable verdict rather than bedrock.
  class: artifact
  severity: important
  checks:
    - eval/methodology

- id: evaluation/ask-for-a-described-category-not-a-bare-number
  section: "Ask for a described category, not a bare number"
  claim: Where the model itself returns a judgment, ask for a point on a small closed scale whose every point carries a described trigger and keep free numbers for quantities the model did not self-report, because verbalized confidence clusters on a few round anchors, a bare number invites a threshold nobody argued for, and only a described anchor gives two raters the same referent.
  class: artifact
  severity: important
  checks:
    - eval/verdict-scale

- id: evaluation/evaluate-a-multi-agent-system-unit-by-unit
  section: "Evaluate a multi-agent system unit by unit"
  claim: Score a multi-agent system unit by unit, each against its own golden dataset and metric, instead of one end-to-end number that cannot say which unit failed.
  class: static
  severity: important
  checks:
    - eval/coverage
  note: Mapped as coverage - a unit visible only inside an end-to-end score is an uncovered capability. The "units exposed as separately-runnable pieces" half of the claim belongs to the Part 3 and Part 5 rows.

- id: evaluation/build-escalation-ladders-spend-measurement-where-it-pays
  section: "Build escalation ladders: spend measurement where it pays"
  claim: Let a cheap high-precision method settle the common case and escalate only the residual, with the precision/recall crossover located by measurement because a rule set is a precision floor, not a recall guarantee.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: eval-audit is the owner, and none of its checks asks whether a fast-path/escalation threshold was justified by an independent recall probe at the crossover rather than set by feel.

- id: evaluation/step-by-step-running-an-evaluation
  section: "Step-by-step: running an evaluation"
  claim: Runbook for one evaluation - name the decision, establish and freeze an independent dataset, fix the harness, change one variable, run each candidate several times, score quality with full cost, calibrate the judge, then decide, record and re-measure.
  class: process
  severity: important
  note: A procedure a snapshot cannot show was followed; each substantive step is mapped by the rows above.

- id: evaluation/name-the-anti-patterns-out-loud
  section: "Name the anti-patterns out loud"
  claim: Scan every result for the six named anti-patterns - grading your own homework, "we added more patterns", the single run, quality without cost, moving the goalposts mid-experiment, demo-driven selection.
  class: artifact
  severity: important
  checks:
    - eval/contamination
    - eval/coverage
    - eval/methodology
    - eval/reproducibility
  note: Two of the six - the single run and quality without cost - inherit the gaps recorded on measure-honestly-a and measure-honestly-b.

- id: evaluation/see-also
  section: "See also"
  claim: Cross-links to Parts 4, 6 and 8 and the handbook index.
  class: informative

# --- Part 8: Documentation & knowledge capture ------------------------------

- id: documentation/aim-for-docs-that-stand-alone-drifted-docs-are-worse-than-none-a
  section: "Aim for docs that stand alone; drifted docs are worse than none"
  claim: Aim for docs that convey on their own what the system does and how it is built without reading the source, and hold every claim in them to the rule that governs a test - it must be verifiable and it must have been verified - because a drifted doc launders a stale belief into an authoritative-looking claim and so does more damage than a missing one, which makes finding and fixing a dead cross-link, an unresolvable import path or a renamed flag real work rather than tidying.
  class: static
  severity: important
  checks:
    - docs/coverage
    - docs/cross-referencing
  gap:
    recommendation: extend-skill
    note: docs-audit is the owner - its `docs/coverage` check reaches the stand-alone standard as a per-component documented/partial/gap status and `docs/cross-referencing` reaches the dead cross-link, but drift itself has no column - a doc that confidently describes a flag the code renamed is neither a missing doc nor a broken link, so the doc-versus-source comparison the skill's evidence pass builds has nowhere to land.

- id: documentation/aim-for-docs-that-stand-alone-drifted-docs-are-worse-than-none-b
  section: "Aim for docs that stand alone; drifted docs are worse than none"
  claim: Move a change and its documentation together in the same pull request, not later.
  class: artifact
  severity: important
  gap:
    recommendation: new-domain
    target: "#11"
    note: whether a code change carried its doc update in the same pull request is delivery-trail evidence, and no skill in the family reads commit or pull-request history - the delivery-trail domain the target issue creates, which would hand docs-audit the code-only-PR signal.

- id: documentation/keep-the-architecture-vs-research-split
  section: "Keep the architecture-vs-research split"
  claim: Keep two kinds of writing distinct - architecture docs, prescriptive and describing what is actually implemented, and research docs, background investigation marked explicitly not authoritative - cross-link the two when an investigation lands in code instead of letting transcripts accumulate among the prescriptive docs, and organize the whole tree by audience and concern behind a navigable index every docs pull request keeps current.
  class: static
  severity: important
  checks:
    - docs/organization
    - docs/cross-referencing
  gap:
    recommendation: extend-skill
    note: partial - docs-audit is the owner, the placement and cross-linking halves are covered exactly, but the section also requires a research doc to be marked explicitly not authoritative for current behaviour, and no check reads a doc's labelling; `docs/organization` sees only where a doc sits, so a correctly filed but unmarked research doc passes both cited checks.
  note: The split is one of docs-audit's own standing rules and `docs/cross-referencing` names the background-to-prescriptive reciprocal link outright, so the fit is close to exact on placement and linkage. The labelling residue is recorded as the gap above rather than left in this note.

- id: documentation/keep-the-decision-trail-artifacts-a
  section: "Keep the decision-trail artifacts"
  claim: Keep the six records that make a decision and its evidence survive the moment - the forward-looking spec, plan and ADR, and the backward-looking story, experiment write-up and results log - reserving the ADR for a decision meant to outlive both a spec and a story, leaving implementation-level rationale in the story, and never skipping the story, which holds the why and the surprises a diff cannot.
  class: artifact
  severity: important
  checks:
    - eval/regression-tracking
  gap:
    recommendation: extend-skill
    note: mapped only on the results log, which is the leaderboard-or-history record that check asks for; docs-audit owns the rest as docs-tree artifacts, yet no check asks whether a piece of work left its spec, plan, ADR, story or experiment write-up - its `docs/coverage` check is per code component, not per decision - the same gap Part 1's step-by-step row records for the spec and the plan, and the per-change half of it needs the delivery-trail evidence base (#11).

- id: documentation/keep-the-decision-trail-artifacts-b
  section: "Keep the decision-trail artifacts"
  claim: Treat the data model itself as a first-class context artifact alongside the decision trail - a versioned, explicit description of the schemas the system works over plus their known quirks and invariants, that both people and agents are pointed at - because an agent left to infer it from scattered code reinvents it wrong and an undocumented quirk is a bug waiting for the next author.
  class: static
  severity: important
  checks:
    - docs/coverage
  gap:
    recommendation: extend-skill
    note: partial - docs-audit is the owner, and its `docs/coverage` check reaches presence and depth (a schema surface with no dedicated doc is a gap row, one documented without its quirks and invariants lands as partial), but the section also requires the description to be versioned, and no check asks whether a doc carries a version that tracks the schema it describes.

- id: documentation/audit-docs-like-a-test-suite-a
  section: "Audit docs like a test suite"
  claim: Run periodic passes that re-read the documentation against the source and fix what has drifted, along three axes - organization (misfiled, duplicated or deprecated content, and the shape of the tree), cross-referencing (every internal link resolving, no orphans, reciprocal links present) and coverage (each code component documented, partial or a gap) - because the value is not the tidy diff but the guarantee that every claim was checked against reality.
  class: static
  severity: important
  checks:
    - docs/organization
    - docs/cross-referencing
    - docs/coverage
  note: The three axes named here are docs-audit's three checks, which makes this the closest section-to-skill fit in Part 8. The cadence ("periodic") is the same audit-cadence question Part 1's make-the-standard-executable row records as sitting outside every skill's evidence base.

- id: documentation/audit-docs-like-a-test-suite-b
  section: "Audit docs like a test suite"
  claim: Wire a link-and-index checker into CI as the cheapest guardrail, so a dead link or an unindexed doc fails the build instead of rotting quietly.
  class: static
  severity: minor
  checks:
    - ci/gate-enforcement
  gap:
    recommendation: extend-skill
    note: "`ci/gate-enforcement` asks whether a checker that exists is actually required, so a project with no checker at all passes it; docs-audit is the owner and treats the checker as a deliverable it may propose rather than as a check it scores."

- id: documentation/keep-the-living-docs-current-too-a
  section: "Keep the living docs current too"
  claim: Keep every module and public symbol carrying a docstring that says what it does and how to use it, updated whenever the purpose or interface changes and audited both ways, for coverage and for staleness, and route fixing one through the normal code gate rather than the lighter docs-only path.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: "This is the fullest of the three docstring rows, and each of its axes is a near miss to a different opt-in record. docs/docstring-standard checks conformance to 'the project's convention', a locally-defined bar that can be weaker than this claim's fixed 'what it does and how to use it' ask. docs/docstring-coverage and docs/docstring-staleness carry the same near misses as the other two docstring rows (an existence bar vs. the quality bar, and contradiction vs. the broader currency ask). Nothing checks whether a docstring fix that resolves one of these actually took the normal code gate rather than the lighter docs-only path. Third of the three docstring rows (with ci-and-static-analysis-b and coding-hygiene-rules-that-surface-at-review-d); the code-gate clause is unique to this row."

- id: documentation/keep-the-living-docs-current-too-b
  section: "Keep the living docs current too"
  claim: Hold the coding rules, review thresholds and git workflow in the project's binding-rules file, the one the team and the coding agents both read as authoritative, and maintain it - where it and this handbook disagree, the rules file wins and the handbook is the bug.
  class: static
  severity: important
  gap:
    recommendation: extend-skill
    note: the same unmapped claim as the README's where-the-binding-rules-live row, stated from the documentation side - docs-audit is the owner and has no check for an authoritative rules file or for a doc-versus-doc contradiction, and ci-audit's `ci/gate-enforcement` reads that mismatch only for what the file claims CI enforces.

- id: documentation/keep-the-living-docs-current-too-c
  section: "Keep the living docs current too"
  claim: Document a prompt or SOP change in its commit message with the why rather than only the what, and keep it in its own commit where you can.
  class: artifact
  severity: minor
  gap:
    recommendation: extend-skill
    note: the same unmapped claim and the same owners as Part 2's prompt-and-sop-engineering row - eval-audit's `eval/prompt-quality` owns prompt-change hygiene through its missing-versioning-or-changelog clause and prompt-audit states the convention in its own remediation section, but neither actually reads commit messages to verify it, which is the evidence base the delivery-trail domain (#11) would supply.

- id: documentation/keep-the-living-docs-current-too-d
  section: "Keep the living docs current too"
  claim: Keep any generated diagram in a text metalanguage (Mermaid, PlantUML, D2) rather than a binary image and regenerate it from the source of truth on merge, so it cannot drift the way a hand-drawn or model-drawn one does and stays diffable in review like the rest of the source.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: docs-audit is the owner but no check reads the form a doc's assets take - a checked-in binary diagram is neither misfiled, unlinked, nor an undocumented component - and the regenerate-on-merge half becomes a ci-audit `ci/gate-enforcement` question only once such a job already exists.

- id: documentation/house-rule-dont-hard-wrap-markdown-source
  section: "House rule: don't hard-wrap Markdown source"
  claim: Write one paragraph as one line in the Markdown source and let the renderer wrap - never hard-wrap prose to a column and never reflow a code block or a diagram - so a one-word edit stays a one-line diff and the source reads well in tools that soft-wrap.
  class: static
  severity: minor
  gap:
    recommendation: extend-skill
    note: mechanically checkable and entirely unmapped - docs-audit is the owner and reads what the docs say and where they sit, never how their source is formatted.

- id: documentation/checklist-shipping-documentation
  section: "Checklist: shipping documentation"
  claim: Eight-item recap for shipping documentation - docs moved in the same pull request as the change, each path, flag, import and cross-link verified against the source, prescriptive content in architecture docs with superseded exploration in research docs cross-linked, the relevant decision-trail artifact present, touched docs reachable from an index with reciprocal links, docstrings updated for any changed purpose or interface, Markdown source not hard-wrapped, and a link-and-index checker guarding it in CI where possible.
  class: process
  severity: important
  note: A recap, so what it adds is the act of working the list before shipping. Each of the eight items is owned by a Part 8 row above.

- id: documentation/see-also
  section: "See also"
  claim: Cross-links to Parts 1 and 7 and the handbook index.
  class: informative

# --- Part 9: Security, dependencies & supply chain --------------------------

- id: security-supply-chain/first-party-code-trace-a-path-from-source-to-sink
  section: "First-party code: trace a path from source to sink"
  claim: Report a security finding as a path from an untrusted source to a dangerous sink and name both, counting model and tool outputs as untrusted sources alongside HTTP handlers, CLI arguments, file and object-store reads, message queues and the environment, then neutralize at the sink (parameterized queries, an argument-list subprocess with no shell, safe deserialization, hardened XML) and validate and canonicalize at the boundary (allowlists, path-containment checks, URL-host allowlisting).
  class: static
  severity: critical
  checks:
    - security/injection
    - security/dangerous-calls
    - security/unsafe-io
  note: The three checks carry the sink taxonomy this section names, and tracing a verified source-to-sink path is the skill's own load-bearing evidence step. The agent-specific source - an LLM or tool output treated as untrusted rather than as trusted data - is declared in the skill's scope section rather than as a check, so it rides along with the checks above rather than being separately citable.

- id: security-supply-chain/grant-the-agent-the-least-privilege-it-needs
  section: "Grant the agent the least privilege it needs"
  claim: Treat an agent's granted powers as an attack surface in their own right - never concentrate the lethal trifecta of private-data access, untrusted-content exposure and the ability to act on the outside world in one agent without a human gate on the acting edge, default a diagnostic, research or analysis agent to read-only tool and MCP access, and widen write access per tool and per purpose, never wholesale and never to production or the pipeline for convenience.
  class: static
  severity: critical
  gap:
    recommendation: extend-skill
    note: security-audit is the owner, since prompt injection as application security is explicitly its surface, but none of its six checks reads an agent's granted tool and MCP surface; ci-audit's `ci/permissions-secrets` is the nearest and scopes least privilege to the pipeline token rather than to what an agent is allowed to do.

- id: security-supply-chain/secrets-never-commit-them-and-rotate-dont-just-delete-a
  section: "Secrets: never commit them, and rotate: don't just delete"
  claim: Keep no credential in source, defaults, tests, fixtures or notebooks - a secret read from the environment is fine, a secret literal is not.
  class: static
  severity: critical
  checks:
    - security/secrets-in-code
  note: An exact fit - the check names defaults, tests, fixtures and notebooks in the same breath, and reading the line to tell an environment lookup from a literal is its stated verification step.

- id: security-supply-chain/secrets-never-commit-them-and-rotate-dont-just-delete-b
  section: "Secrets: never commit them, and rotate: don't just delete"
  claim: Treat a committed secret as live until rotated - rotate the credential at its provider first, then remove the line, then purge history if it was ever pushed - and never merely suppress this one.
  class: static
  severity: critical
  checks:
    - security/secret-history
  gap:
    recommendation: extend-skill
    note: partial - `security/secret-history` reaches the part of this claim that was a pure citeability gap when this note was last written, because it scans the full commit history rather than only the working tree, and its review lens asks directly whether a confirmed leak was rotated rather than only deleted, which is the rotate-then-purge half security-audit otherwise only stated outside a citable record (the severity rubric refuses to suppress a confirmed secret and demands rotation, the fix patterns give the rotate-then-remove-then-purge order). Three residues remain. Adoption - the check is opt-in and off by default, so a routine sweep that never enables it never asks the question; security-audit owns that fix, either by promoting the check off opt-in or by stating in its header that a secrets pass is incomplete until the history scan has run, which is why this gap stays extend-skill rather than report-only. Provider-side rotation - as this row's own note records, no check can confirm from a repo snapshot that a flagged rotation actually happened. Detection reach - the scan only sees a secret still present in history, so a team that purges without rotating, the exact merely-suppress move this claim forbids, leaves nothing to flag and the review lens never fires. That third residue is a blind spot rather than the near-miss rule's disqualifier, which refuses a mapping whose check would be *satisfied by* the violation, as an inline model ID satisfies `eval/reproducibility`. On a leak that is still there this check flags it rather than passing it, which is why this row maps with a residue instead of gapping everything.
  note: Rotation at the provider is the half no snapshot can settle - a repo can show that the literal is gone and the history clean, never that the credential was actually retired.

- id: security-supply-chain/depend-only-on-what-you-can-account-for-a
  section: "Depend only on what you can account for"
  claim: Know your third-party surface transitively and audit four things - licenses against your own license and distribution model, advisories affecting the resolved versions, freshness (outdated, yanked or end-of-life), and hygiene (declared-but-unused, used-but-undeclared, conflicting pins) - pinning direct dependencies and committing the lockfile as the record of what actually ran.
  class: static
  severity: critical
  checks:
    - deps/licenses
    - deps/vulnerabilities
    - deps/freshness
    - deps/hygiene
  note: An exact fit - the handbook's four axes are deps-audit's four core checks, transitivity is the resolved graph the skill takes as ground truth, and unpinned floating direct dependencies sit inside `deps/freshness`.

- id: security-supply-chain/depend-only-on-what-you-can-account-for-b
  section: "Depend only on what you can account for"
  claim: Apply the same rule to the AI surface - treat the model and the provider as dependencies too, pinning model versions where the provider allows it and recording which model produced a given result, because a silent model upgrade is an unpinned dependency that can move your eval numbers out from under you.
  class: static
  severity: important
  checks:
    - eval/reproducibility
  gap:
    recommendation: extend-skill
    note: eval-audit's `eval/reproducibility` asks for a pinned, recorded model version and so covers the eval surface exactly; deps-audit is the owner of the wider claim and its inventory is the package graph, so a model or a provider never enters the dependency surface it accounts for.

- id: security-supply-chain/depend-only-on-what-you-can-account-for-c
  section: "Depend only on what you can account for"
  claim: Know your providers' data-retention terms, and where you operate under a data-protection regime confirm that each provider processing personal data has the legal basis to - a signed DPA, acceptable residency and retention.
  class: artifact
  severity: critical
  gap:
    recommendation: new-domain
    target: "#4"
    note: nothing in the family reads provider terms, a processor register or a signed DPA, and the compliance evidence lives outside the repo entirely; this is squarely the data-protection domain the target issue creates.

- id: security-supply-chain/treat-the-pipeline-as-a-privileged-environment
  section: "Treat the pipeline as a privileged environment"
  claim: Treat CI as a privileged runtime holding your secrets as well as the merge gate - default the pipeline token to read-only and widen only the single job that genuinely needs it, pin third-party actions to an immutable commit SHA rather than a mutable tag, never run untrusted pull-request code with secrets in scope, and prefer short-lived federated credentials over long-lived stored secrets.
  class: static
  severity: critical
  checks:
    - ci/permissions-secrets
    - ci/action-supply-chain
    - ci/trigger-safety
  note: The second exact fit in Part 9 - each of the four clauses, federated credentials included, is named inside one of these three checks.

- id: security-supply-chain/turn-every-fix-into-a-gate
  section: "Turn every fix into a gate"
  claim: Encode each class of safety fix as an executable check wired into CI and pre-commit - a SAST plus secret scan for first-party code, a CVE-plus-license gate for dependencies, a workflow linter and an action-pin checker for the pipeline - because every fix is one-time while the class of problem is forever.
  class: static
  severity: important
  checks:
    - ci/gate-enforcement
  gap:
    recommendation: extend-skill
    note: the same shape and the same owner as Part 1's make-the-standard-executable row, applied to the safety surfaces - ci-audit's `ci/gate-enforcement` audits the gates a project already has, while security-audit and deps-audit detect the available scanners only to choose their own tooling, so no check reports that a repo runs no secret scan and no CVE gate at all, and the pre-commit half is unrepresented anywhere.

- id: security-supply-chain/verify-against-the-real-artifacts
  section: "Verify against the real artifacts"
  claim: Run the verification counterpart of this page as a standing check against the real artifacts - the first-party code, the resolved dependency graph, the workflow files and their branch-protection reality - report-only first to see where the repo hurts, then fix one surface at a time in its own reviewed change, judging severity by context and by whether a path is actually reachable and what it reaches.
  class: artifact
  severity: important
  gap:
    recommendation: report-only
    note: audit-core's own charter again, as on Part 1's make-the-standard-executable row - audit cadence and past audit reports sit outside every skill's evidence base, and the reachability-weighted severity rule is carried by security-audit's threat-context scoping and its severity rubric, neither of which is a check a row can cite.

- id: security-supply-chain/checklist-a-security--supply-chain-sweep
  section: "Checklist: a security & supply-chain sweep"
  claim: Fifteen-item recap in six groups - first-party code (a verified source-to-sink path behind each finding, model and tool outputs treated as untrusted, sinks neutralized and input validated at the boundary), agent privileges (no lethal trifecta in one agent without a human gate, diagnostic and research agents read-only, no convenience write grants), secrets (no literals in source, tests, fixtures or notebooks, an exposed credential rotated then removed then purged), dependencies (transitive licenses, CVEs, freshness and hygiene, direct deps pinned with the lockfile committed, models and providers pinned and recorded with retention and DPA basis confirmed), pipeline (least-privilege token, actions pinned to commit SHAs, no untrusted pull-request code with secrets and federated credentials preferred), and standing (each class of fix now an executable gate).
  class: process
  severity: critical
  note: A recap, so what it adds is the act of working the list during a sweep. Each of the fifteen items is owned by a Part 9 row above.

- id: security-supply-chain/see-also
  section: "See also"
  claim: Cross-links to Parts 1, 2, 6 and 7 and the handbook index.
  class: informative

