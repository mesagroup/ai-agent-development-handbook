[project]
name = "ai-agent-development-handbook"
version = "0.1.0"
description = "Engineering handbook for agentic systems, and the audit skill family that checks a codebase against it"
requires-python = ">=3.11"
# markdown is used by scripts/render_handbook_artifact.py. In the origin repository it
# arrived transitively via mkdocs; here it is a direct dependency.
# fonttools is used by scripts/book_figures.py: the book build subsets the figure font
# into each of the EPUB's figures, so a reader draws the labels in the face they were set in.
dependencies = [
    "pyyaml>=6.0",
    "markdown>=3.5",
    "fonttools>=4.66.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "deptry>=0.20"]

# `deps/hygiene` prescribes `deptry`, and until #14 nothing here ran it - so
# the check that would have caught this repository's own undeclared `markdown`
# import only fired when a human invoked the skill. It is declared rather than
# fetched at run time so the gate's version comes from the lockfile.
#
# Every module in `scripts/` is first-party. They import each other as
# top-level names because `scripts/` is `sys.path[0]` at run time and is put on
# the path by `tests/scripts/conftest.py` under pytest, and `deptry` reads such
# an import as a missing dependency: eight of them across five files before
# this list existed. The list names the whole directory rather than only the
# modules that trip it today, because a module there is first-party by
# construction and a list of what is imported this week would fail CI on the
# next sibling import. `tests/test_deptry_gate.py` holds it against the
# directory.
#
# `tests/` stays outside the scan, which is `deptry`'s own default and is
# correct rather than merely conservative: including it reports `pytest` as a
# misplaced dev dependency once per test module, because `deptry` then reads
# the suite as production code.
[tool.deptry]
known_first_party = [
    "audit_checks",
    "book_figures",
    "build_python_fixtures",
    "check_handbook_citations",
    "emit_audit_issues",
    "grade_python_fixture_run",
    "kdp_print",
    "python_fixture_spec",
    "render_handbook_artifact",
    "render_handbook_book",
    "render_handbook_traceability",
    "render_python_fixture_expectations",
    "run_python_fixture_lens",
]

# Carried over from the origin repository, where this code was written and linted. A
# different config here would flag the migrated files on arrival, which reads
# as a defect in the extraction rather than as a change of house style.
[tool.ruff]
line-length = 88
target-version = "py312"
# docs/ holds no first-party Python, but recent ruff formats Python inside
# markdown fences. Specs, plans and stories are a record of what was written at
# the time; reformatting their code samples would edit the record.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E712"]  # allow == True/False in test assertions for clarity
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
