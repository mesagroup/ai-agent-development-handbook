[project]
name = "ai-agent-development-handbook"
version = "0.1.0"
description = "Engineering handbook for agentic systems, and the audit skill family that checks a codebase against it"
requires-python = ">=3.11"
# markdown is used by scripts/render_handbook_artifact.py. In lidia-agents it
# arrived transitively via mkdocs; here it is a direct dependency.
dependencies = ["pyyaml>=6.0", "markdown>=3.5"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

# Carried over from lidia-agents, where this code was written and linted. A
# different config here would flag the migrated files on arrival, which reads
# as a defect in the extraction rather than as a change of house style.
[tool.ruff]
line-length = 88
target-version = "py312"
# docs/ holds no first-party Python, but recent ruff formats Python inside
# markdown fences. Specs, plans and stories are a record of what was written at
# the time; reformatting their code samples would edit the record.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E712"]  # allow == True/False in test assertions for clarity
"scripts/**" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
