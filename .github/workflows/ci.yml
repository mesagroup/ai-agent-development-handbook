name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests
        run: uv run pytest tests/ -q

      # The bidirectional gate: every matrix row cites check records that
      # exist, and every record's handbook citation names a real section.
      # A half-applied change to either view fails here.
      - name: Traceability integrity
        run: uv run python scripts/render_handbook_traceability.py --check

      # The fixture definition and its published expectations are one artifact.
      # Editing the spec module without re-rendering fails here, which is what
      # stops the record describing a fixture the generator no longer builds.
      - name: Fixture expectations integrity
        run: uv run python scripts/render_python_fixture_expectations.py --check

      # `deps/hygiene` prescribes this tool and nothing ran it until #14, so
      # the check that would have caught this repository's own undeclared
      # `markdown` import only fired when a human invoked the skill.
      #
      # `deptry` writes its whole report to stderr and leaves stdout empty, and
      # signals findings with exit 1 - both measured in `deps/hygiene`'s own
      # note and re-verified on this branch. So do not pipe this step's output:
      # redirecting stdout looks tidy, captures nothing, and leaves a gate that
      # is green because it reported into a void. The non-zero exit is the
      # finding, not the tool failing.
      - name: Dependency hygiene
        run: uv run deptry .
